<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><title>Login form</title></head>
<body class="frame">
<div class="form-card">
  <h3 id="form-title" data-testid="form-title">Sign in</h3>
  <p class="sub">Use <code>tester</code> and <code>password123</code>.</p>
  <div class="field"><label for="username">Username</label>
    <input class="input" id="username" name="username" data-testid="username" autocomplete="off" placeholder="Enter username"></div>
  <div class="field"><label for="password">Password</label>
    <input class="input" id="password" name="password" type="password" data-testid="password" placeholder="Enter password"></div>
  <label class="check"><input type="checkbox" id="remember" data-testid="remember"> Remember me</label>
  <div class="row">
    <button class="btn" id="btn-login" data-testid="btn-login">Sign in</button>
    <button class="btn ghost" id="btn-clear" data-testid="btn-clear">Clear</button>
  </div>
  <p id="login-result" data-testid="login-result" class="status" role="status"></p>
</div>
<script>
  if (new URLSearchParams(location.search).get('dynamic')) document.getElementById('form-title').textContent = 'Sign in (dynamic frame)';
  const r = document.getElementById('login-result');
  document.getElementById('btn-login').addEventListener('click', () => {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) { r.textContent = 'Enter a username and password.'; r.className = 'status err'; return; }
    if (u === 'tester' && p === 'password123') { r.textContent = 'Signed in as ' + u; r.className = 'status ok'; }
    else { r.textContent = 'Wrong username or password.'; r.className = 'status err'; }
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    ['username','password'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('remember').checked = false;
    r.textContent = ''; r.className = 'status';
  });
</script>
</body></html>
