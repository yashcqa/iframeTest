<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons frame</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="frame">
  <h3 id="buttons-title" data-testid="buttons-title">Buttons</h3>
  <div class="row">
    <button id="btn-plus" data-testid="btn-plus">Add 1</button>
    <button id="btn-reset" data-testid="btn-reset" class="secondary">Reset</button>
    <span>Count: <strong id="counter" data-testid="counter">0</strong></span>
  </div>
  <div class="row">
    <button id="btn-alert" data-testid="btn-alert">Show alert</button>
    <button id="btn-confirm" data-testid="btn-confirm">Show confirm</button>
    <button id="btn-prompt" data-testid="btn-prompt">Show prompt</button>
    <button id="btn-delayed" data-testid="btn-delayed" class="secondary">Show text after 3s</button>
  </div>
  <p id="dialog-result" data-testid="dialog-result" class="status" role="status"></p>
  <p id="delayed-text" data-testid="delayed-text" hidden>Delayed text is visible</p>
<script>
  const copy = new URLSearchParams(location.search).get('copy');
  if (copy) document.getElementById('buttons-title').textContent = 'Buttons (copy ' + copy + ')';
  let n = 0; const c = document.getElementById('counter');
  const out = document.getElementById('dialog-result');
  document.getElementById('btn-plus').onclick = () => c.textContent = ++n;
  document.getElementById('btn-reset').onclick = () => c.textContent = n = 0;
  document.getElementById('btn-alert').onclick = () => { alert('Hello from iframe'); out.textContent = 'Alert closed'; };
  document.getElementById('btn-confirm').onclick = () => { out.textContent = confirm('Do you agree?') ? 'Confirm: OK' : 'Confirm: Cancel'; };
  document.getElementById('btn-prompt').onclick = () => { const v = prompt('Your name?'); out.textContent = v === null ? 'Prompt: Cancel' : 'Prompt: ' + v; };
  document.getElementById('btn-delayed').onclick = () => setTimeout(() => document.getElementById('delayed-text').hidden = false, 3000);
</script>
</body></html>
